# ============================================================
# Scraper Interpelli — automazione inserimento in Supabase
#
# - Pianificazione: Lunedì-Venerdì alle 07:00, 12:00 e 15:00 UTC
#   (= 09:00, 14:00 e 17:00 italiane, orari reali di pubblicazione
#   degli uffici scolastici)
# - Trigger manuale: workflow_dispatch (GitHub → Actions → Run workflow)
#
# Secrets richiesti (repo Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY, TELEGRAM_BOT_TOKEN
# Canali Telegram: 10 canali ATTIVI configurati nel codice (CANALI_TELEGRAM_REGIONALI
#   in src/lib/telegram.ts): 9 regionali + ATA nazionale (@scuoleradar_ata).
#   Gli avvisi 🔵 [AVVISO ATA] vengono pubblicati SEMPRE anche su ATA nazionale.
#   Override opzionali: TELEGRAM_CHANNELS_REGIONALI (JSON Regione → @canale) e
#   TELEGRAM_CHANNELS (retro-compatibile, JSON provincia → @canale).
# ============================================================
name: Scraper Interpelli

on:
  schedule:
    - cron: '0 7,12,15 * * 1-5'
  workflow_dispatch:

concurrency:
  group: scraper-interpelli
  cancel-in-progress: false

jobs:
  scrape:
    name: Scraping interpelli → Supabase (interpelli, fallback notices)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Necessari per committare il LEDGER anti-duplicato (.scuoleradar/).
    permissions:
      contents: write

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installazione dipendenze
        run: npm ci

      - name: Validazione TypeScript dello scraper
        run: npm run scrape:check

      - name: Verifica template notifiche (copy, gerarchia, scadenze, link, footer)
        continue-on-error: true
        run: |
          if npm run test:telegram:template; then
            echo "::notice::Template Telegram/alert conformi (copy, gerarchia, scadenze, link etichettati, footer)."
          else
            echo "::warning::Template notifiche non conformi: verificare telegram.ts / alertInterpello.ts."
          fi

      - name: Verifica espansione ELENCHI (pagine indice → avvisi individuali)
        continue-on-error: true
        run: |
          if npm run test:elenchi; then
            echo "::notice::Elenchi OK: ogni voce di una pagina indice diventa un avviso con il proprio link."
          else
            echo "::warning::Espansione elenchi non conforme: verificare src/scraper/elenchi.ts."
          fi

      - name: Verifica anti-duplicato (ledger + canali) e copy notifiche
        continue-on-error: true
        run: |
          if npm run test:dedup && npm run test:copy; then
            echo "::notice::Dedup OK: nessun duplicato possibile e nessuna copy di quota nei messaggi."
          else
            echo "::warning::Dedup/copy non conformi: verificare notifier.ts, channelLog.ts, telegram.ts."
          fi

      - name: Esecuzione scraper e inserimento in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNELS: ${{ secrets.TELEGRAM_CHANNELS }}
          ADMIN_ALERT_SECRET: ${{ secrets.ADMIN_ALERT_SECRET }}
          SCRAPER_SCADENZA_MAX: '20'
          SCRAPER_ELENCHI_MAX: '25'
        run: npm run scrape

      - name: Commit del LEDGER anti-duplicato (se aggiornato)
        if: always()
        run: |
          if [ ! -f .scuoleradar/notifiche-ledger.json ]; then
            echo "Nessun ledger da committare."
            exit 0
          fi
          git config user.name "scuoleradar-bot"
          git config user.email "bot@scuoleradar.it"
          git add .scuoleradar/notifiche-ledger.json
          if git diff --cached --quiet; then
            echo "Ledger invariato: nessun commit."
          else
            git commit -m "chore(scraper): aggiorna il ledger anti-duplicato [skip ci]"
            git push
          fi

