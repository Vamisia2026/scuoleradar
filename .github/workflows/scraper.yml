# ============================================================
# Scraper Interpelli — automazione inserimento in Supabase
#
# - Pianificazione: Lunedì-Venerdì alle 07:00, 12:00 e 15:00 UTC
#   (= 09:00, 14:00 e 17:00 italiane, orari reali di pubblicazione
#   degli uffici scolastici)
# - Trigger manuale: workflow_dispatch (GitHub → Actions → Run workflow)
#
# Secrets richiesti (repo Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
# ============================================================
name: Scraper Interpelli

on:
  schedule:
    - cron: '0 7,12,15 * * 1-5'
  workflow_dispatch:

jobs:
  scrape:
    name: Scraping interpelli → Supabase (notices)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installazione dipendenze
        run: npm ci

      - name: Validazione TypeScript dello scraper
        run: npm run scrape:check

      - name: Esecuzione scraper e inserimento in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FONTE_TEST_URL: ''
          SCRAPER_PROVINCE_TEST: MI,TO
        run: npm run scrape

