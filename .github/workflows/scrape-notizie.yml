# ============================================================
# Scraper Notizie — automazione quotidiana dell'ingestione MIM
#
# - Pianificazione: ogni giorno alle 06:00 UTC
#   (= 07:00 italiane in inverno, 08:00 in estate)
# - Trigger manuale: workflow_dispatch (GitHub → Actions → Run workflow)
# - Esegue `npm run scrape:notizie`: raccoglie le notizie reali dal MIM e
#   dalla Gazzetta Ufficiale (log HTTP esplicito per ogni fonte, nessun
#   silent-fail), applica il motore di rilevanza e redazione
#   (`relevanceEngine.ts`: filtro anti-rumore, date esatte, acronimi spiegati,
#   STRICT URL INTEGRITY con link canonici `/web/guest/-/<slug>` validati
#   HTTP 200, brand "ScuoleRadar") e applica il TETTO SETTIMANALE
#   (max 3 articoli ad alto valore per settimana, finestra mobile di 7 giorni:
#   se non ci sono provvedimenti vincolanti si pubblicano 0 articoli).
#   Poi AGGIORNA con accumulo `src/departments/notizie/data/notizieIngestite.ts`
#   (le notizie già presenti restano, solo le nuove vengono aggiunte, dedupe per id).
# - Esiti chiari nei log: "✓ HTTP 200 - N new posts criteria matched"
#   (anche "0 new posts") oppure "✗ HTTP FAIL" (exit code 1 → warning).
# - Se la valutazione editoriale non trova contenuti meritevoli non viene
#   creato alcun commit: la bacheca resta invariata fino a provvedimenti reali.
# - Commit automatico dei dati aggiornati: il push usa GITHUB_TOKEN e
#   non rigenera il workflow (nessun loop); il deploy (Vercel ecc.)
#   riparte automaticamente dal push sul ramo predefinito. Se non ci sono
#   nuove notizie non viene creato alcun commit.
# ============================================================
name: Scraper Notizie

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scraper-notizie
  cancel-in-progress: false

jobs:
  scrape-notizie:
    name: Ingestione Notizie MIM → dati committati
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installazione dipendenze
        run: npm ci

      - name: Validazione TypeScript del pipeline Notizie
        run: npm run scrape:notizie:check

      - name: Esecuzione ingestione Notizie (MIM)
        run: |
          if npm run scrape:notizie; then
            echo "Ingestione Notizie completata."
          else
            echo "::warning::Ingestione Notizie non riuscita (fonte MIM non raggiungibile?). Il workflow continua per committare i dati eventualmente prodotti."
          fi

      - name: Commit e push dei dati aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/departments/notizie/data/notizieIngestite.ts
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati Notizie: nessun commit necessario."
          else
            git commit -m "chore(notizie): aggiornamento automatico dati ingestiti [skip ci]"
            git push
            echo "Dati Notizie aggiornati e committati: il deploy parte automaticamente dal push."
          fi

      - name: Riepilogo esito ingestione (cron giornaliero)
        if: always()
        run: |
          {
            echo "## 📰 Cron giornaliero Notizie — esito"
            echo ""
            echo "- **Frequenza**: ogni giorno alle 06:00 UTC (07:00/08:00 italiane)."
            echo "- **Valutazione editoriale**: filtro anti-rumore + link canonici validati HTTP 200 + tetto **max 3 articoli a settimana** prima del salvataggio."
            echo "- **Verifica pubblicazione**: controllare il passo precedente — *nessun commit* significa nessun contenuto meritevole di pubblicazione."
          } >> "$GITHUB_STEP_SUMMARY"
