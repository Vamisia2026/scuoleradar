# ============================================================
# Scraper Notizie — automazione quotidiana dell'ingestione MIM
#
# - Pianificazione: ogni giorno alle 06:00 UTC
#   (= 07:00 italiane in inverno, 08:00 in estate)
# - Trigger manuale: workflow_dispatch (GitHub → Actions → Run workflow)
# - Esegue `npm run scrape:notizie`: raccoglie le notizie reali dalle fonti
#   NAZIONALI con log HTTP esplicito per ogni fonte (nessun silent-fail) e
#   applica il WATERFALL di priorità:
#     1. MIM nazionale (notizie + avvisi + home)  2. Gazzetta Ufficiale
#     3. ARAN (contrattazione nazionale)          4. giurisdizione/previdenza
#   La pipeline si ferma al PRIMO livello che produce articoli validi.
#   POLICY NAZIONALE: le fonti REGIONALI (USR /web/usr-*) sono ESCLUSE e le
#   eventuali voci regionali già in archivio vengono rimosse.
#   Il motore di rilevanza applica il filtro anti-rumore, le date esatte,
#   gli acronimi spiegati, la STRICT URL INTEGRITY (link canonici validati
#   HTTP 200) e il brand "ScuoleRadar"; lookback 15 giorni per le notizie,
#   60 giorni per gli atti strutturali (CCNL) e 45 per gli atti numerati
#   (decreti/ordinanze), con tetto di 6 articoli nella finestra (~3/settimana).
#   Poi AGGIORNA con accumulo `src/departments/notizie/data/notizieIngestite.ts`
#   (le notizie già presenti restano, solo le nuove vengono aggiunte, dedupe per id).
# - Esiti chiari nei log: "✓ HTTP 200 - N new posts criteria matched"
#   (anche "0 new posts") oppure "✗ HTTP FAIL" (exit code 1 → warning).
# - Se la valutazione editoriale non trova contenuti meritevoli non viene
#   creato alcun commit: la bacheca resta invariata fino a provvedimenti reali.
# - Commit automatico dei dati aggiornati: il push usa GITHUB_TOKEN e
#   non rigenera il workflow (nessun loop); il deploy (Vercel ecc.)
#   riparte automaticamente dal push sul ramo predefinito. Se non ci sono
#   nuove notizie non viene creato alcun commit.
# ============================================================
name: Scraper Notizie

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scraper-notizie
  cancel-in-progress: false

jobs:
  scrape-notizie:
    name: Ingestione Notizie MIM → dati committati
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installazione dipendenze
        run: npm ci

      - name: Validazione TypeScript del pipeline Notizie
        run: npm run scrape:notizie:check

      - name: Esecuzione ingestione Notizie (MIM)
        run: |
          if npm run scrape:notizie; then
            echo "Ingestione Notizie completata."
          else
            echo "::warning::Ingestione Notizie non riuscita (fonte MIM non raggiungibile?). Il workflow continua per committare i dati eventualmente prodotti."
          fi

      - name: Verifica cadenza settimanale (≥ 1 notizia negli ultimi 7 giorni)
        continue-on-error: true
        run: |
          if npm run test:notizie-rate; then
            echo "::notice::Cadenza settimanale rispettata (≥ 1 notizia negli ultimi 7 giorni)."
          else
            echo "::warning::Nessun articolo negli ultimi 7 giorni: la sezione Notizie è FERMA. Verificare fonti/parser/URL canonici."
          fi

      - name: Verifica invariante NAZIONALE (nessuna fonte regionale)
        continue-on-error: true
        run: |
          if npm run test:notizie-nazionale; then
            echo "::notice::Invariante nazionale rispettata (solo fonti nazionali in archivio)."
          else
            echo "::warning::Violazione della policy nazionale: verificare fonti/archivio Notizie."
          fi

      - name: Commit e push dei dati aggiornati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/departments/notizie/data/notizieIngestite.ts
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati Notizie: nessun commit necessario."
          else
            git commit -m "chore(notizie): aggiornamento automatico dati ingestiti [skip ci]"
            git push
            echo "Dati Notizie aggiornati e committati: il deploy parte automaticamente dal push."
          fi

      - name: Riepilogo esito ingestione (cron giornaliero)
        if: always()
        run: |
          {
            echo "## 📰 Cron giornaliero Notizie — esito"
            echo ""
            echo "- **Frequenza**: ogni giorno alle 06:00 UTC (07:00/08:00 italiane)."
            echo "- **Fonti (waterfall NAZIONALE)**: 1. MIM (notizie/avvisi/home) → 2. Gazzetta Ufficiale → 3. ARAN → 4. giurisdizione/previdenza. Ci si ferma al primo livello con articoli validi."
            echo "- **Policy**: SOLO copertura nazionale — le fonti regionali (USR \`/web/usr-*\`) sono escluse e rimosse dall'archivio."
            echo "- **Valutazione editoriale**: filtro anti-rumore + atti nazionali numerati e recenti + link canonici validati HTTP 200; lookback **15 gg** (notizie), **60 gg** (CCNL), **45 gg** (atti numerati) + tetto **max 6 articoli** (≈3/settimana)."
            echo "- **Verifica pubblicazione**: controllare il passo precedente — *nessun commit* significa nessun contenuto meritevole di pubblicazione."
            echo "- **Cadenza settimanale**: controllo automatico ≥ 1 notizia negli ultimi 7 giorni (\`npm run test:notizie-rate\`) e invariante nazionale (\`npm run test:notizie-nazionale\`)."
            echo "- **Nota**: le voci senza data di fonte non consumano il tetto settimanale; l'archivio è ripulito dalle fonti regionali ad ogni esecuzione."
          } >> "$GITHUB_STEP_SUMMARY"
