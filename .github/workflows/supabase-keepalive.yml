name: Supabase Keepalive

on:
  schedule:
    # Esegue la chiamata ogni Lunedì e Giovedì alle 05:00 UTC
    - cron: '0 5 * * 1,4'
  workflow_dispatch: # Permette l'esecuzione manuale da GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API (SQL Read Query)
        run: |
          curl -s -f -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
